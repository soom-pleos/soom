<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>깨우기 시뮬레이터</title>
<link rel="icon" href="data:,">
<!--
  깨우기 브라우저 시뮬레이터. 파일 하나로 동작하고 외부로 요청을 보내지 않는다.
  판단 엔진: engine/src/main/kotlin (앱과 같은 소스)을 Kotlin/JS 로 컴파일해 아래 첫 번째 script 에 그대로 넣었다.
  만드는 법: websim/build.sh
-->
<style>
/*
 * 깨우기 시뮬레이터.
 * 페이지: 현대차 실내 플라스틱 위에 잉크로 그린 평면도. 색은 아래 여섯 개와 헤드유닛 화면색뿐이다.
 * 넓은 화면: 평면도 높이를 뷰포트 높이에 맞춘다(세로의 55~60%). 오른쪽 열(헤드유닛, 제어 기록)과 아래 버튼 띠까지 한 화면에 들어온다.
 * 헤드유닛 안(.car): 앱(ui/Screens.kt)과 같은 색과 치수. 외부 글꼴이나 이미지는 쓰지 않는다.
 */
:root {
  --plastic: #E3E6E9;
  --ink: #1E2933;
  --ink2: #6B7782;
  --stale: #C79A3E;
  --stale2: #B0552F;
  --fresh: #3D78AE;
  --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono", "DejaVu Sans Mono", monospace;
  /* 평면도 높이: 뷰포트 높이의 60% 까지. 오른쪽 열에 460px 은 남긴다(평면도 가로세로 비 880:470) */
  --plan-h: clamp(300px, min(60vh, calc((min(100vw, 1920px) - 508px) * 470 / 880)), 660px);
}
* { box-sizing: border-box; }
html { background: var(--plastic); color-scheme: light; }
body { margin: 0; background: var(--plastic); color: var(--ink); font-family: var(--font); font-size: 15px; font-weight: 400; line-height: 1.5; -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: break-word; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--fresh); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0; padding: 0; }
/* 세로 간격은 뷰포트 높이를 따라 조금 늘어난다(높은 화면에서 아래쪽만 비지 않게) */
.page { max-width: 1920px; margin: 0 auto; padding: clamp(16px, 3vh, 30px) 16px 14px; }

/* ---------- 물리 버튼: 얇은 잉크 테두리, 작은 반경, 켜짐은 버튼 안 표시등 ---------- */
.key { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; min-width: 40px; padding: 0 14px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--plastic); font-size: 15px; font-weight: 600; white-space: nowrap; }
.key:hover:not(:disabled) { background: var(--ink); color: var(--plastic); }
.key:active:not(:disabled) { transform: translateY(1px); }
.key:disabled { border-color: var(--ink2); color: var(--ink2); }
.key.sq { padding: 0; width: 40px; font-size: 18px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink2); }
[aria-pressed="true"] > .dot, [data-air="fresh"] > .dot { background: var(--fresh); border-color: var(--fresh); }
[data-air="recirc"] > .dot { background: var(--stale); border-color: var(--stale); }
.key:hover:not(:disabled) > .dot { border-color: var(--plastic); }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
.seg button { min-height: 40px; min-width: 44px; padding: 0 14px; border: 0; background: var(--plastic); font-size: 15px; font-weight: 600; white-space: nowrap; }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--plastic); }
.seg button:hover:not([aria-pressed="true"]) { text-decoration: underline; text-underline-offset: 3px; }
.seg button:focus-visible { outline-offset: -4px; outline-color: var(--fresh); }

/* ---------- 상단 ---------- */
.top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 32px; margin-bottom: clamp(12px, 3.6vh, 36px); }
.intro { flex: 1 1 420px; min-width: 0; }
.top h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.3; }
.top p { margin: 4px 0 0; font-size: 15px; max-width: 60ch; }
.top-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#btnDemo[aria-pressed="true"], #btnTrust[aria-pressed="true"] { background: var(--ink); color: var(--plastic); }
.speed { position: relative; }
.tip { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; width: max-content; max-width: min(620px, 90vw); margin: 0; padding: 6px 10px; border-radius: 4px; background: var(--ink); color: var(--plastic); font-size: 13px; line-height: 1.45; visibility: hidden; }
.speed:hover .tip, .speed:focus-within .tip { visibility: visible; }

/* ---------- 배치 ---------- */
.layout { display: grid; grid-template-columns: calc(var(--plan-h) * 880 / 470) minmax(0, 1fr); grid-template-areas: "plan hu" "strip strip"; gap: clamp(10px, 2.4vh, 24px) 16px; align-items: start; }
.plan-col { grid-area: plan; min-width: 0; }
.hu-col { grid-area: hu; min-width: 0; }
.strip { grid-area: strip; }

/* ---------- 평면도 ---------- */
.plan { position: relative; width: 100%; aspect-ratio: 880 / 470; }
.plan.v { aspect-ratio: 470 / 880; max-width: 420px; margin: 0 auto; }
#planSvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.plan > .seats, .plan .seat, .plan .readout, .plan .hvac, .plan .win { position: absolute; }
.plan > .seats { inset: 0; pointer-events: none; }
.seat { pointer-events: auto; border: 0; padding: 0; background: transparent; border-radius: 10px; }
.seat:hover:not(:disabled) { outline: 1.5px dashed var(--ink); outline-offset: 3px; }
.seat:focus-visible { outline: 3px solid var(--fresh); outline-offset: 3px; }

.readout { display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
.ppm { font-size: 56px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.ppm-l { margin-top: 4px; font-size: 13px; }
.lim { margin-top: 10px; width: 132px; }
.lim-track { position: relative; height: 4px; border: 1px solid var(--ink); border-radius: 0; }
.lim-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ink); }
.lim.over .lim-fill { background: var(--stale2); }
.lim-t { margin-top: 3px; font-size: 13px; text-align: right; }

/* 공조 패널: 대시보드 가운데에 붙은 실제 물건이라 테두리와 바탕이 있다 */
.hvac { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 6px; background: var(--plastic); border: 1.5px solid var(--ink); border-radius: 8px; }
.hv { justify-content: flex-start; width: 100%; padding: 0 10px; }
.hv-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; border-radius: 6px; }
.hv-v { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.15; font-size: 15px; font-weight: 600; }
.hv-l { font-size: 13px; font-weight: 400; white-space: nowrap; }
.win { display: flex; align-items: center; justify-content: flex-end; gap: 10px; border-radius: 6px; }
.win-l { font-size: 13px; white-space: nowrap; text-align: right; }
.win-v { font-weight: 600; }
.win-b { display: inline-flex; gap: 4px; }
.win-b .key { font-size: 12px; }
.plan.v .win { flex-direction: column; align-items: stretch; justify-content: center; gap: 6px; }
.plan.v .win-l { white-space: normal; text-align: center; }
.plan.v .win-l .win-v { display: block; }
.plan.v .win-b { flex-direction: column; align-items: center; }

/* 앱이 차를 바꾼 자리: 파란 테두리 한 번 */
.flash { animation: flash 1.4s ease-out 1; }
@keyframes flash { 0%, 35% { box-shadow: 0 0 0 3px var(--fresh); } 100% { box-shadow: 0 0 0 3px rgba(61, 120, 174, 0); } }

#planSvg .fog { transition: fill-opacity 1.2s linear, fill 1.2s linear; }
#planSvg .wind path { stroke-dasharray: 34 20; animation: wind var(--wind-s, 2s) linear infinite; }
@keyframes wind { to { stroke-dashoffset: -108; } }

.plan-foot { min-height: 30px; margin: 6px 0 0; font-size: 15px; max-width: 80ch; }
.plan-foot.hint { font-weight: 600; }

/* ---------- 헤드유닛 ---------- */
.bezel { padding: 8px; background: var(--ink); border-radius: 12px; }
.screen-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 3px; background: #0E1116; }
.under { display: flex; align-items: flex-start; gap: 12px; margin-top: 8px; }
.gloss { flex: 1; min-width: 0; margin: 0; min-height: 40px; display: flex; align-items: center; font-size: 13px; line-height: 1.45; }
.log-h { margin: 8px 0 6px; font-size: 15px; font-weight: 600; }
.sdk { margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 13px; line-height: 1.7; border-top: 1.5px solid var(--ink); }
.sdk li { display: flex; gap: 12px; align-items: baseline; padding: 2px 0; border-bottom: 1px solid rgba(30, 41, 51, .18); }
.sdk .c { font-weight: 600; white-space: nowrap; }
.sdk .ok { font-weight: 600; }
.sdk .n { font-family: var(--font); margin-left: auto; text-align: right; }
.sdk .revert .c::before { content: "\21BA  "; font-weight: 400; }
.sdk .empty { font-family: var(--font); display: block; padding: 6px 0; border-bottom: 0; color: var(--ink2); }
.sdk .new { animation: flash-row 1.4s ease-out 1; }
@keyframes flash-row { 0%, 35% { background: rgba(61, 120, 174, .18); } 100% { background: rgba(61, 120, 174, 0); } }

/* ---------- 아래 띠: 운전석 조작 ---------- */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 8px; padding: clamp(12px, 2.4vh, 24px) 0 0; border-top: 1.5px solid var(--ink); }
.strip .key { padding: 0 12px; }
.gear button { min-width: 48px; font-size: 18px; }
.turn { display: inline-flex; align-items: center; gap: 4px; }
.turn-l { margin: 0 4px 0 6px; font-size: 15px; }
.turn .key { padding: 0 10px; font-size: 13px; }

/* ---------- 엔진 기록 ---------- */
.evbox { margin-top: clamp(6px, 1.6vh, 16px); }
.evbox summary { display: inline-flex; align-items: center; min-height: 40px; cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; list-style: none; }
.evbox summary::-webkit-details-marker { display: none; }
.evlog { margin: 4px 0 0; padding: 0; list-style: none; max-height: 320px; overflow: auto; font-family: var(--mono); font-size: 13px; line-height: 1.6; }
.evlog li { display: flex; gap: 10px; white-space: pre-wrap; word-break: break-word; }
.evlog .in { font-style: italic; }
.evlog .err { color: var(--stale2); }

/* ---------- 좁은 화면: 평면도, 헤드유닛, 버튼 띠 순서로 세로 ---------- */
@media (max-width: 1099px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "plan" "hu" "strip"; gap: 16px; }
  .top-ctl { width: 100%; }
}
@media (max-width: 699px) {
  .page { padding: 16px 14px 20px; }
}

/* ======================================================================
   헤드유닛 화면 안(.car). 앱과 같은 어두운 색. 논리 크기 1280x720 을 폭에 맞춰 축소
   ====================================================================== */
.bezel {
  --bg: #0E1116; --panel: #171C24; --panel2: #1F2630; --accent: #7FD1AE; --yes: #3DBF7A;
  --warn: #F2B96B; --danger: #E5705C; --muted: #8B96A5; --fg: #ECEFF3; --yellow: #FFD54A; --orange: #FF8A3D;
  --line: #2A323D; --deep: #0A0D12;
  --appfont: Roboto, "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
.car { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; transform: scale(var(--k, 1)); display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: var(--appfont); line-height: 1.25; overflow: hidden; font-variant-numeric: normal; }
.car button { font-family: inherit; }
.car :focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
.car-main { position: relative; flex: 1; min-height: 0; }
.home, .idle { position: absolute; inset: 0; padding: 16px; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; min-height: 62px; }
.topbar .name { font-size: 30px; font-weight: 700; }
.topbar .state { font-size: 18px; color: var(--muted); white-space: nowrap; }
.topbar .said { flex: 1; min-width: 0; padding: 0 24px; font-size: 24px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: inline-block; border-radius: 999px; padding: 5px 12px; font-size: 18px; font-weight: 600; white-space: nowrap; }
.pill.warn { color: var(--warn); background: rgba(242, 185, 107, .18); }
.pill.muted { color: var(--muted); background: rgba(139, 150, 165, .18); }
.pill.accent { color: var(--accent); background: rgba(127, 209, 174, .18); }
.home-row { flex: 1; min-height: 0; display: flex; gap: 12px; margin-top: 12px; }
.card { background: var(--panel); border-radius: 18px; }
.gauge-card { flex: 6; min-width: 0; display: flex; flex-direction: column; padding: 16px 20px; }
.gauge-head { display: flex; align-items: center; }
.gauge-head .t { flex: 1; font-size: 18px; color: var(--muted); }
.occ { display: flex; align-items: center; }
.occ svg { width: 22px; height: 30px; margin: 0 3px; }
.occ svg * { fill: none; stroke: var(--muted); stroke-width: 2; }
.occ svg.in * { fill: var(--fg); stroke: var(--fg); }
.occ .n { margin-left: 8px; font-size: 22px; font-weight: 600; }
.gauge-box { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.gauge-box svg { width: 100%; max-height: 100%; display: block; }
#gFill { transition: stroke-dasharray .7s linear, stroke .5s linear; }
#gNum { transition: fill .5s linear; }
.gauge-line { font-size: 26px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gauge-line.vent { color: var(--accent); }
.gauge-line.weak { color: var(--orange); }
.gauge-line.long { font-size: 21px; }
.car.s .gauge-line.long { font-size: 22px; }
.side { flex: 4; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.side .card { flex: 1; min-height: 0; padding: 12px 18px; display: flex; flex-direction: column; justify-content: center; border: 3px solid transparent; }
.side .card.wp { border-color: var(--yes); }
.card .ct { font-size: 18px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.card.wp .ct { color: var(--yes); }
.trip-v { font-size: 44px; font-weight: 700; white-space: nowrap; }
.pills { display: flex; gap: 8px; min-height: 0; }
.stop-row { display: flex; align-items: center; }
.stop-row .l { flex: 1; min-width: 0; }
.stop-route { font-size: 18px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop-name { font-size: 28px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop-km { margin-left: 8px; font-size: 46px; font-weight: 700; white-space: nowrap; }
.card.wp .stop-km { color: var(--yes); }
.stop-none { font-size: 24px; color: var(--muted); }
.today-l { font-size: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.runbar { background: var(--accent); color: var(--bg); padding: 10px 24px; font-size: 26px; font-weight: 700; white-space: nowrap; overflow: hidden; display: flex; align-items: center; gap: 16px; }
.runbar[hidden] { display: none; }
.runbar .run-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.runbar .run-cancel { flex: none; width: 220px; height: 76px; border: 0; border-radius: 16px; background: var(--bg); color: var(--fg); font-size: 34px; font-weight: 700; cursor: pointer; }
.fresh-btn { display: block; width: 100%; height: 84px; margin-top: 10px; border: 0; border-radius: 18px; background: var(--yes, #3DBF7A); color: #fff; font-size: 36px; font-weight: 700; cursor: pointer; }
.fresh-btn[hidden] { display: none; }
.runbar .en { margin-left: 16px; font-size: 18px; font-weight: 600; opacity: .8; }
.evidence { background: var(--deep); color: var(--accent); padding: 5px 24px; font-family: var(--mono); font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(14, 17, 22, .97); }
.en-line { color: var(--muted); font-size: 20px; line-height: 1.35; text-align: center; margin-top: 8px; }
#proposal { padding: 28px 40px; }
/* 보통: 문장, 버튼, 남은 시간 순서로 세로. .p-say 는 상자를 만들지 않고 순서만 정한다 */
.p-say { display: contents; }
.p-text { order: 1; font-size: 36px; font-weight: 700; line-height: 50px; text-align: center; text-wrap: balance; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
#pEn { order: 2; }
.p-btns { order: 3; display: flex; gap: 20px; width: 100%; margin-top: 36px; }
.p-btns button, .r-btns button { height: 96px; border: 0; border-radius: 20px; }
.p-yes { flex: 1.4; background: var(--yes); color: #fff; font-size: 44px; font-weight: 700; }
.p-no { position: relative; overflow: hidden; flex: 1; background: var(--panel2); color: var(--fg); font-size: 34px; }
.p-btns button:hover, .r-btns button:hover, .a-btns button:hover { filter: brightness(1.08); }
.p-info { order: 4; margin-top: 22px; font-size: 24px; color: var(--muted); white-space: nowrap; }
/* 조수석에 사람이 있으면: 문장은 왼쪽, 답 버튼은 조수석 쪽(오른쪽)에 세로로 */
#proposal.pass { flex-direction: row; align-items: center; gap: 32px; }
#proposal.pass .p-say { display: flex; flex-direction: column; flex: 1; min-width: 0; }
#proposal.pass .p-text, #proposal.pass #pEn, #proposal.pass .p-info { text-align: left; }
#proposal.pass .p-text { text-wrap: wrap; -webkit-line-clamp: 5; }
#proposal.pass .p-btns { flex-direction: column; width: 36%; margin-top: 0; gap: 16px; }
#proposal.pass .p-btns button { flex: none; }
#proposal.pass .p-yes { height: 132px; }
/* 예고: 답은 [취소] 하나. 버튼 아래쪽 막대가 취소할 수 있는 시간만큼 줄어든다 */
#proposal.announce .p-btns { justify-content: center; }
#proposal.announce .p-no { flex: none; width: 46%; font-weight: 700; }
.p-bar { position: absolute; left: 0; bottom: 0; height: 10px; width: 100%; background: var(--accent); transition: width .25s linear; }
/* 쉼 카드는 글이 많아 뒤 화면이 비치지 않게 한다 */
#rest { padding: 24px 40px; background: var(--bg); }
.r-title { font-size: 36px; font-weight: 700; line-height: 48px; text-align: center; }
.r-count { margin: 12px 0; font-size: 120px; font-weight: 700; line-height: 130px; color: var(--accent); font-variant-numeric: tabular-nums; }
.r-hint { font-size: 24px; color: var(--muted); }
/* 쉼 진입 때의 바깥 공기 질문: 카드 아래쪽. 질문이 뜨면 카운트다운을 줄여 자리를 낸다 */
#rest.asking .r-count { margin: 0; font-size: 84px; line-height: 92px; }
#rest.asking .r-hint { display: none; }
.r-ask { width: 100%; margin-top: 14px; padding-top: 18px; border-top: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; }
.r-q { font-size: 32px; font-weight: 700; line-height: 42px; text-align: center; }
.r-q .en-line { display: block; margin-top: 2px; font-weight: 400; }
.r-btns { display: flex; gap: 20px; width: 100%; margin-top: 16px; }
.r-info { margin-top: 10px; font-size: 22px; color: var(--muted); }
.r-note { margin-top: 18px; max-width: 1040px; font-size: 20px; line-height: 1.4; color: var(--muted); text-align: center; }
.toast-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; pointer-events: none; }
.toast { background: var(--panel2); border-radius: 20px; padding: 26px 36px; font-size: 32px; font-weight: 600; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
#arrival { padding: 24px 40px; background: rgba(14, 17, 22, .96); }
.a-card { width: 100%; background: var(--panel); border-radius: 20px; padding: 24px 32px; }
.a-top { font-size: 18px; color: var(--muted); }
.a-head { font-size: 34px; font-weight: 700; line-height: 44px; }
.a-head-en { font-size: 20px; color: var(--muted); }
.a-metrics { display: flex; gap: 28px; margin-top: 14px; }
.a-metrics .k { font-size: 18px; color: var(--muted); white-space: nowrap; }
.a-metrics .v { font-size: 28px; font-weight: 700; white-space: nowrap; }
.a-air { margin-top: 14px; font-size: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-lines { margin-top: 10px; }
.a-lines div { font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-lines .en { font-size: 18px; color: var(--muted); margin-left: 10px; }
.a-trust { margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--line); }
.a-trust-q { font-size: 28px; font-weight: 700; line-height: 38px; }
.a-trust .en-line { text-align: left; margin-top: 2px; }
.a-btns { display: flex; gap: 14px; margin-top: 16px; }
.a-btns button { height: 96px; border: 0; border-radius: 16px; font-size: 28px; font-weight: 700; }
.a-yes { flex: 1.2; background: var(--yes); color: #fff; }
.a-no { flex: 1.5; background: var(--panel2); color: var(--fg); }
.a-ok { flex: 1; background: var(--accent); color: var(--bg); }
#arrival.trust .a-ok { flex: .6; background: var(--panel2); color: var(--fg); font-weight: 600; }

.idle-cards { display: flex; gap: 12px; margin-top: 12px; }
.idle-cards .card { border-radius: 16px; padding: 16px 18px; min-width: 0; }
.idle-cards .ct { font-size: 18px; margin-bottom: 4px; }
.idle-v { font-size: 34px; font-weight: 700; }
#iStop { font-size: 30px; }
.idle-v small { font-size: 18px; font-weight: 400; color: var(--muted); }
.idle-s { font-size: 18px; color: var(--muted); line-height: 1.4; }
.idle-mid { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.idle-big { font-size: 44px; font-weight: 700; }
.idle-sub { margin-top: 12px; font-size: 24px; color: var(--muted); }
.idle-said { margin-top: 24px; font-size: 22px; font-weight: 600; color: var(--accent); max-width: 1100px; }

/* ---------- 작은 헤드유닛(폭 560px 미만): 논리 크기 960x540. 글자 크기는 거의 그대로 두어 화면에서는 3할쯤 크게 보인다.
   가장 작은 글자도 24px(화면에서 11px 안팎) 아래로 내려가지 않게 한다 ---------- */
.car.s { width: 960px; height: 540px; }
.car.s .home, .car.s .idle { padding: 12px; }
.car.s .topbar { min-height: 52px; }
.car.s .topbar .state { font-size: 24px; }
.car.s .topbar .name { line-height: 1.1; }
.car.s .topbar .said { font-size: 24px; padding: 0 14px; }
.car.s .pill { font-size: 22px; padding: 4px 10px; }
.car.s .home-row { gap: 10px; margin-top: 8px; }
.car.s .gauge-card { padding: 10px 14px; }
.car.s .card .ct, .car.s .gauge-head .t, .car.s .stop-route { font-size: 24px; }
.car.s .occ .n { font-size: 26px; }
.car.s .gauge-line { font-size: 28px; }
.car.s .side { gap: 10px; }
.car.s .side .card { padding: 4px 14px; }
.car.s .trip-v { font-size: 38px; line-height: 1.1; }
.car.s .stop-name { font-size: 28px; }
.car.s .stop-km { font-size: 40px; }
.car.s .stop-none { font-size: 24px; }
.car.s .today-l { font-size: 26px; }
.car.s .runbar { padding: 8px 16px; font-size: 26px; }
.car.s .runbar .en { font-size: 22px; margin-left: 12px; }
.car.s .evidence { padding: 4px 16px; font-size: 22px; }
.car.s .en-line { font-size: 24px; margin-top: 4px; }
.car.s #proposal { padding: 16px 28px; }
.car.s .p-text { line-height: 48px; }
.car.s .p-btns { margin-top: 22px; gap: 16px; }
.car.s .p-info { margin-top: 14px; font-size: 26px; }
.car.s #proposal.pass { gap: 22px; }
.car.s #proposal.pass .p-yes { height: 120px; }
.car.s #rest { padding: 12px 28px; }
.car.s .r-title { font-size: 34px; line-height: 44px; }
.car.s .r-count { margin: 6px 0; font-size: 110px; line-height: 118px; }
.car.s .r-hint { font-size: 26px; }
.car.s #rest.asking .r-count { font-size: 80px; line-height: 88px; }
.car.s .r-ask { margin-top: 6px; padding-top: 10px; }
.car.s .r-q { font-size: 32px; line-height: 40px; }
.car.s .r-btns { margin-top: 10px; gap: 16px; }
.car.s .r-info { margin-top: 6px; font-size: 24px; }
.car.s .r-note { margin-top: 10px; font-size: 24px; line-height: 1.3; }
.car.s #rest.asking .r-note { margin-top: 6px; }
.car.s .toast { font-size: 32px; padding: 20px 28px; }
.car.s #arrival { padding: 10px 16px; }
.car.s .a-card { padding: 12px 22px; }
.car.s .a-top { display: none; }
.car.s .a-head { font-size: 32px; line-height: 40px; }
.car.s .a-head-en { font-size: 24px; }
.car.s .a-metrics { gap: 20px; margin-top: 8px; }
.car.s .a-metrics .k { font-size: 24px; }
.car.s .a-metrics .v { font-size: 28px; }
.car.s .a-air { margin-top: 8px; font-size: 26px; }
.car.s .a-lines { margin-top: 6px; }
.car.s .a-lines div { font-size: 24px; }
.car.s .a-lines .en { font-size: 22px; }
.car.s .a-trust { margin-top: 8px; padding-top: 8px; }
.car.s .a-trust-q { font-size: 28px; line-height: 36px; }
.car.s .a-btns { margin-top: 10px; gap: 12px; }
.car.s .idle-cards { gap: 10px; margin-top: 8px; }
.car.s .idle-cards .card { padding: 10px 14px; }
.car.s .idle-cards .ct { white-space: normal; line-height: 1.2; }
.car.s .idle-v { font-size: 32px; }
.car.s #iStop { font-size: 28px; }
.car.s .idle-v small { font-size: 24px; }
.car.s .idle-s { font-size: 24px; line-height: 1.25; }
.car.s .idle-big { font-size: 40px; }
.car.s .idle-sub { margin-top: 8px; font-size: 26px; }
.car.s .idle-said { margin-top: 12px; font-size: 24px; }

/* 화면이 작게 줄어 화면 안 버튼이 40px 보다 낮아지면 같은 버튼을 베젤 아래 줄에 따로 낸다(헤드유닛의 일부) */
.actbar { display: flex; gap: 8px; margin-top: 10px; }
.actbar button { flex: 1; min-height: 48px; border: 0; border-radius: 8px; font-family: var(--appfont); font-size: 18px; font-weight: 700; }
.actbar .yes { flex: 1.4; background: var(--yes); color: #fff; }
.actbar .no { background: var(--panel2); color: var(--fg); }
.actbar .okb { background: var(--accent); color: var(--bg); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .flash { box-shadow: 0 0 0 3px var(--fresh); }
}
</style>
</head>
<body>
<div class="page">

<header class="top">
  <div class="intro">
    <h1 data-i18n="title">깨우기 시뮬레이터</h1>
    <p id="desc" data-i18n="desc"></p>
  </div>
  <div class="top-ctl">
    <button class="key" id="btnDemo" type="button"></button>
    <button class="key" id="btnTrust" type="button"></button>
    <button class="key" id="btnReset" type="button" data-i18n="btnReset">처음으로</button>
    <div class="speed">
      <div class="seg" id="segSpeed" role="group" aria-label="속도" aria-describedby="speedNote">
        <button type="button" data-speed="real" aria-pressed="false" data-i18n="speedReal">실제 속도</button>
        <button type="button" data-speed="demo" aria-pressed="true" data-i18n="speedDemo">60배</button>
      </div>
      <p class="tip" id="speedNote" role="tooltip"></p>
    </div>
    <div class="seg" id="segLang" role="group" aria-label="Language">
      <button type="button" data-lang="ko" lang="ko" aria-pressed="true">한국어</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
    </div>
  </div>
</header>

<main class="layout">

<section class="plan-col" aria-labelledby="planTitle">
  <h2 class="sr" id="planTitle" data-i18n="planTitle">차 실내</h2>
  <div class="plan" id="plan">
    <svg id="planSvg" aria-hidden="true" focusable="false"></svg>
    <div class="seats" id="seats">
      <button type="button" class="seat" data-seat="0" disabled aria-pressed="true"></button>
      <button type="button" class="seat" data-seat="1" aria-pressed="false"></button>
      <button type="button" class="seat" data-seat="2" aria-pressed="false"></button>
      <button type="button" class="seat" data-seat="3" aria-pressed="false"></button>
      <button type="button" class="seat" data-seat="4" aria-pressed="false"></button>
    </div>
    <div class="readout" id="readout" aria-live="off">
      <div class="ppm" id="ppmNum">--</div>
      <div class="ppm-l" data-i18n="ppmEst">ppm 추정</div>
      <div class="lim"><div class="lim-track"><div class="lim-fill" id="limFill"></div></div><div class="lim-t" id="limText"></div></div>
    </div>
    <div class="hvac" id="hvac" role="group" aria-labelledby="hvacName">
      <span class="sr" id="hvacName" data-i18n="hvac">공조</span>
      <button type="button" class="key hv" id="hvRecirc" data-ctl="recirc" data-air="fresh"><span class="dot" aria-hidden="true"></span><span id="hvT">외기</span></button>
      <div class="hv-row" data-ctl="fan">
        <button type="button" class="key sq" id="fanDn">-</button><span class="hv-v"><span class="hv-l" data-i18n="fan">풍량</span><span id="fanV"></span></span><button type="button" class="key sq" id="fanUp">+</button>
      </div>
      <div class="hv-row" data-ctl="temp">
        <button type="button" class="key sq" id="tempDn">-</button><span class="hv-v"><span class="hv-l" data-i18n="temp">온도</span><span id="tempV"></span></span><button type="button" class="key sq" id="tempUp">+</button>
      </div>
    </div>
    <div class="win" id="winCtl" data-ctl="window" role="group" aria-labelledby="winName">
      <span class="win-l"><span id="winName" data-i18n="winLabel">운전석 창문</span> <span class="win-v" id="winV"></span></span>
      <span class="win-b">
        <button type="button" class="key sq" id="winDn">&#9660;</button><button type="button" class="key sq" id="winUp">&#9650;</button>
      </span>
    </div>
  </div>
  <p class="plan-foot" id="planFoot" aria-live="polite"></p>
</section>

<section class="hu-col">
  <div class="bezel">
    <div class="screen-wrap" id="screenWrap">
      <div class="car" id="car">
        <div class="car-main">

          <!-- 주행 중 홈 -->
          <div class="home" id="home" hidden>
            <div class="topbar">
              <div><div class="name">깨우기</div><div class="state" id="hState"></div></div>
              <div class="said" id="hSaid"></div>
              <div><span class="pill warn" data-i18n="simPill">브라우저 시뮬레이터</span></div>
            </div>
            <div class="home-row">
              <section class="card gauge-card">
                <div class="gauge-head">
                  <div class="t" data-i18n="gaugeTitle">실내 공기 (CO2 추정)</div>
                  <div class="occ" id="occ"></div>
                </div>
                <div class="gauge-box"><svg id="gauge" viewBox="0 0 702 360" role="img" aria-label="CO2"></svg></div>
                <div class="gauge-line" id="gLine"></div>
                <button class="fresh-btn" id="btnFresh" type="button" hidden></button>
              </section>
              <div class="side">
                <section class="card">
                  <div class="ct" data-i18n="tripTitle">트립 시간</div>
                  <div class="trip-v" id="tripV"></div>
                  <div class="pills" id="tripPills"></div>
                </section>
                <section class="card" id="stopCard">
                  <div class="ct" id="stopTitle"></div>
                  <div class="stop-row" id="stopRow">
                    <div class="l"><div class="stop-route" id="stopRoute"></div><div class="stop-name" id="stopName"></div></div>
                    <div class="stop-km" id="stopKm"></div>
                  </div>
                  <div class="stop-none" id="stopNone" data-i18n="stopNone" hidden>전방 80km 안에 같은 방향 쉼터 없음</div>
                </section>
                <section class="card">
                  <div class="ct" data-i18n="todayTitle">오늘</div>
                  <div class="today-l" id="today1"></div>
                  <div class="today-l" id="today2"></div>
                </section>
              </div>
            </div>
          </div>

          <!-- 정차(대기/도착) 화면 -->
          <div class="idle" id="idle">
            <div class="topbar">
              <div><div class="name">깨우기</div><div class="state" id="iState"></div></div>
              <div class="said"></div>
              <div><span class="pill warn" data-i18n="simPill">브라우저 시뮬레이터</span></div>
            </div>
            <div class="idle-cards">
              <section class="card" style="flex:1">
                <div class="ct" data-i18n="tripTitle">트립 시간</div>
                <div class="idle-v" id="iTrip"></div>
                <div class="idle-s" id="iTripS"></div>
              </section>
              <section class="card" style="flex:1.4">
                <div class="ct" id="iAirT"></div>
                <div class="idle-v"><span id="iPpm">--</span> <small data-i18n="ppmEst">ppm 추정</small></div>
                <div class="idle-s" id="iAirS"></div>
              </section>
              <section class="card" style="flex:1.3">
                <div class="ct" data-i18n="stopPlain">다음 쉼터</div>
                <div class="idle-v" id="iStop"></div>
                <div class="idle-s" id="iStopS"></div>
              </section>
            </div>
            <div class="idle-mid">
              <div class="idle-big" data-i18n="idleBig">기어를 D 로 바꾸면 시작합니다</div>
              <div class="idle-sub" id="idleSub"></div>
              <div class="idle-said" id="iSaid"></div>
            </div>
          </div>
        </div>

        <div class="runbar" id="runbar" hidden><span class="run-text" id="runText"></span><button class="run-cancel" id="runCancel" type="button" hidden></button></div>
        <div class="evidence" id="evidence" hidden></div>

        <!-- 제안 오버레이 -->
        <div class="overlay" id="proposal" hidden>
          <div class="p-say">
            <div class="p-text" id="pText"></div>
            <div class="en-line" id="pEn" hidden></div>
            <div class="p-info" id="pInfo"></div>
          </div>
          <div class="p-btns">
            <button class="p-yes" id="pYes" type="button"></button>
            <button class="p-no" id="pNo" type="button"><span id="pNoT"></span><i class="p-bar" id="pBar" hidden></i></button>
          </div>
        </div>

        <!-- 쉼 카드 -->
        <div class="overlay" id="rest" hidden>
          <div class="r-title" id="rTitle"></div>
          <div class="en-line" id="rEn" hidden></div>
          <div class="r-count" id="rCount"></div>
          <div class="r-hint" data-i18n="restHint">기어 D 로 바꾸면 돌아갑니다</div>
          <div class="r-ask" id="rAsk" hidden>
            <div class="r-q"><span id="rQ"></span><span class="en-line" id="rQEn" hidden></span></div>
            <div class="r-btns">
              <button class="p-yes" id="rYes" type="button"></button>
              <button class="p-no" id="rNo" type="button"></button>
            </div>
            <div class="r-info" id="rInfo"></div>
          </div>
          <div class="r-note" data-i18n="restNote">깨우기는 사람이 내쉰 숨(이산화탄소)만 추정해요. 배기가스(일산화탄소)는 알 수 없어요.</div>
        </div>

        <div class="toast-wrap" id="toastWrap" hidden>
          <div class="toast"><div id="toastT"></div><div class="en-line" id="toastEn" hidden></div></div>
        </div>

        <!-- 도착 카드 -->
        <div class="overlay" id="arrival" hidden>
          <div class="a-card">
            <div class="a-top" data-i18n="arrTop">오늘의 주행</div>
            <div class="a-head" id="aHead"></div>
            <div class="a-head-en" id="aHeadEn" hidden></div>
            <div class="a-metrics" id="aMetrics"></div>
            <div class="a-air" id="aAir"></div>
            <div class="a-lines" id="aLines"></div>
            <div class="a-trust" id="aTrust" hidden>
              <div class="a-trust-q" id="aTrustQ"></div>
              <div class="en-line" id="aTrustEn" hidden></div>
            </div>
            <div class="a-btns">
              <button class="a-yes" id="aTrustYes" type="button" hidden></button>
              <button class="a-no" id="aTrustNo" type="button" hidden></button>
              <button class="a-ok" id="aOk" type="button" data-i18n="ok">확인</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="actbar" id="actbar" hidden>
      <button type="button" class="yes" id="xYes"></button>
      <button type="button" class="no" id="xNo"></button>
      <button type="button" class="yes" id="xTrustYes"></button>
      <button type="button" class="no" id="xTrustNo"></button>
      <button type="button" class="okb" id="xOk" data-i18n="ok">확인</button>
    </div>
  </div>

  <div class="under">
    <p class="gloss" id="subtitle" aria-live="polite"></p>
    <button type="button" class="key" id="btnVoice" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span id="btnVoiceT"></span></button>
  </div>

  <h2 class="log-h" data-i18n="sdkTitle">차가 받은 제어</h2>
  <ul class="sdk" id="sdkLog"></ul>
</section>

<div class="strip" id="strip" role="group" aria-labelledby="stripName">
  <span class="sr" id="stripName" data-i18n="stripName">운전석 조작</span>
  <div class="seg gear" id="segGear" role="group" aria-label="기어">
    <button type="button" data-gear="PARK">P</button>
    <button type="button" data-gear="REVERSE">R</button>
    <button type="button" data-gear="NEUTRAL">N</button>
    <button type="button" data-gear="DRIVE">D</button>
  </div>
  <button type="button" class="key" id="swWiper" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span data-i18n="wiper">와이퍼</span></button>
  <button type="button" class="key" id="swBeam" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span data-i18n="lowBeam">하향등</span></button>
  <div class="turn" role="group" aria-labelledby="turnName">
    <span class="turn-l" id="turnName" data-i18n="turn">깜빡이</span>
    <button type="button" class="key" id="turnL" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span aria-hidden="true">&#9664;</span></button>
    <button type="button" class="key" id="turnR" aria-pressed="false"><span aria-hidden="true">&#9654;</span><span class="dot" aria-hidden="true"></span></button>
  </div>
  <button type="button" class="key" id="swAttn" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span data-i18n="attn">졸음 경고</span></button>
  <button type="button" class="key" id="btnSteer" hidden></button>
  <button type="button" class="key" id="swAuto" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span data-i18n="autoBtn">차 자동 공조</span></button>
  <button type="button" class="key" id="btnTrip" data-i18n="tripBtn">+2시간 주행</button>
  <button type="button" class="key" id="btnEta" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span data-i18n="etaBtn">도착 4분 전</span></button>
  <button type="button" class="key" id="btnWithin" data-i18n="stopWithin">쉼터 도착</button>
  <button type="button" class="key" id="swTrust" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span data-i18n="trustBtn">맡기기</span></button>
</div>

</main>

<details class="evbox" id="evBox">
  <summary id="evSum"></summary>
  <ul class="evlog" id="evLog"></ul>
</details>

</div>

<script>

  var caption = { key: null, demo: false, until: 0 };
  /** 처음 연 사람에게만 주는 힌트: seat(뒷좌석을 눌러 보세요) → gear(기어 D) → done */
  var hint = 'seat';
  /** 돌고 있는 자동 시연. kind 는 'main'(자동 시연) 또는 'trust'(맡기기 시연) */
  var demo = null;
  /** 맡기기 상태(엔진이 들고 있는 값). 페이지 메모리에만 있어서 새로고침하거나 처음으로 돌아가면 꺼진다 */
  function trust() { return JSON.parse(sim.trust); }

  /**
   * 바깥 공기로 달린 시간("오늘" 카드). 앱 FreshAirTally 와 같은 기준으로 센다.
   * 구간은 환기가 성공한 때 열리고 원복이 끝난 때 닫힌다. 원복 없이 두기로 했으면 운전자가 내기순환으로 되돌리거나 주행이 끝날 때까지 이어진다.
   * 닫힌 구간은 단위(분, 60배 데모면 초)로 반올림해 더하고(최소 1), 열려 있는 구간은 지금까지 흐른 만큼을 내림해 보여 준다
   */
  var fresh = {
    since: null, closed: 0, keeping: false,
    unit: function () { return sim.demoFast ? 1000 : 60000; },
    open: function (now) { if (this.since == null) this.since = now; },
    close: function (now) {
      if (this.since != null) this.closed += Math.max(1, Math.round(Math.max(0, now - this.since) / this.unit()));
      this.since = null;
    },
    /** 원복 없이 바깥 공기로 두기로 했다. 구간은 열어 둔다 */
    keep: function (now) { this.keeping = true; this.open(now); },
    /** 운전자가 내기순환으로 되돌렸다. 두기로 한 중이었으면 구간을 닫는다. 반환: 유지가 풀렸는가 */
    onRecircOn: function (now) { if (!this.keeping) return false; this.keeping = false; this.close(now); return true; },
    /** 원복까지 끝났다. 바깥 공기로 두는 중이 아니면 구간을 닫는다 */
    onReverted: function (now) { if (!(this.keeping && !car.recirc)) this.close(now); },
    /** 쉬는 시간은 넣지 않는다. 쉼이 끝나고 여전히 바깥 공기로 두는 중이면 다시 연다 */
    onRestStarted: function (now) { this.close(now); },
    onRestEnded: function (now) { if (this.keeping && !car.recirc) this.open(now); },
    units: function (now) { return this.closed + (this.since == null ? 0 : Math.floor(Math.max(0, now - this.since) / this.unit())); },
    reset: function () { this.since = null; this.closed = 0; this.keeping = false; }
  };

  function occupants() { return car.seats.filter(Boolean).length; }
  function driving() { return ui.tripState === 'DRIVING'; }

  // ---------------------------------------------------------------- 로그

  function stamp(t) { var s = t / 1000; return '+' + Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60).toFixed(1); }
  function logEv(cls, t, text, coalesceKey) {
    var last = evLog[evLog.length - 1];
    // 매 초 오는 같은 종류(추정치, 카운트다운)는 한 줄을 고쳐 쓴다
    if (coalesceKey && last && last.key === coalesceKey) { last.t = t; last.text = text; last.dirty = true; return; }
    evLog.push({ cls: cls, t: t, text: text, key: coalesceKey || null, dirty: true });
    if (evLog.length > 300) evLog.splice(0, evLog.length - 300);
    logsDirty = true;
  }
  function sdk(call, note, isRevert) {
    var t = clock.now();
    sdkLog.push({ t: t, call: call, note: note || '', revert: !!isRevert, fresh: true });
    if (sdkLog.length > 120) sdkLog.shift();
    if (call) ui.evidence = call + ' → ok';
    logEv('say', t, 'SDK  ' + (call ? call + ' → ok' : note));
    sdkDirty = true;
  }
  var logsDirty = true, sdkDirty = true;
  function renderLogs() {
    if (sdkDirty) renderSdk();
    if (!logsDirty && !evLog.some(function (l) { return l.dirty; })) return;
    logsDirty = false;
    if (!$('evBox').open) { logsDirty = true; return; }
    var e = $('evLog');
    var stick = e.scrollHeight - e.scrollTop - e.clientHeight < 40;
    e.innerHTML = evLog.map(function (l) { l.dirty = false; return '<li class="' + l.cls + '"><span class="t">' + stamp(l.t) + '</span><span>' + esc(l.text) + '</span></li>'; }).join('');
    if (stick) e.scrollTop = e.scrollHeight;
  }
  /** 오른쪽 "차가 받은 제어": 호출 한 줄씩. 방금 들어온 줄은 한 번 파랗게 */
  function renderSdk() {
    sdkDirty = false;
    var s = $('sdkLog');
    // 여섯 줄까지: 오른쪽 열이 평면도보다 길어져 아래 버튼 띠를 밀지 않게
    s.innerHTML = sdkLog.length ? sdkLog.slice(-6).map(function (l) {
      var cls = (l.revert ? 'revert' : '') + (l.fresh ? ' new' : '');
      l.fresh = false;
      return '<li class="' + cls.trim() + '">' + (l.call ? '<span class="c">' + esc(l.call) + '</span><span class="ok">ok</span>' : '') +
        (l.note ? '<span class="n">' + esc(l.note) + '</span>' : '') + '</li>';
    }).join('') : '<li class="empty">' + esc(tr('sdkEmpty')) + '</li>';
  }
  function describe(e) {
    switch (e.type) {
      case 'Propose': return 'Propose ' + e.kind + ' [' + e.actions.map(function (a) { return a.type; }).join(', ') + ']' + (e.passengerMayAnswer ? ' 조수석' : '') + ' "' + e.text + '"';
      case 'Announce': return 'Announce ' + e.kind + ' [' + e.actions.map(function (a) { return a.type; }).join(', ') + '] ' + e.cancelWindowSec + 's "' + e.text + '"';
      case 'Quiet': return 'Quiet "' + e.text + '"';
      case 'TrustChanged': return 'TrustChanged 맡김=' + e.state.delegated + ' 연속 동의=' + e.state.consecutiveYes + ' 취소=' + e.state.cancelCount;
      case 'ProposalExpired': return 'ProposalExpired "' + e.text + '"';
      case 'Execute': return 'Execute ' + e.kind + ' [' + e.actions.map(function (a) { return a.type; }).join(', ') + ']';
      case 'Running': return 'Running ' + e.kind + ' ' + e.remainingSec + 's "' + e.label + '"';
      case 'Done': return 'Done ' + e.kind + (e.text ? ' "' + e.text + '"' : ' (말 없음)');
      case 'Deferred': return 'Deferred ' + e.kind + ' ' + e.reason;
      case 'TripStateChanged': return 'TripStateChanged ' + e.state;
      case 'RestStarted': return 'RestStarted ' + e.stopName + ' ' + e.targetMinutes;
      case 'RestTick': return 'RestTick ' + e.remainingSec + 's';
      case 'RestEnded': return 'RestEnded ' + e.restedMinutes + ' "' + e.text + '"';
      case 'AirEstimate': return 'AirEstimate ' + e.ppm + 'ppm ' + e.occupants + '명 한도까지 ' + (e.minutesToLimit == null ? '-' : e.minutesToLimit) + (e.ventilating ? ' 환기 중' : '');
      case 'ArrivalCard': return 'ArrivalCard "' + e.card.headline + '"' + (e.card.trustOffer ? ' 맡기기 질문' : '');
    }
    return e.type;
  }

  // ---------------------------------------------------------------- 엔진 호출(순서대로 하나씩)

  var queue = [], pumping = false;
  /** 마지막으로 받은 Execute 가 원복이 아니었고 아직 Done 이 오지 않았으면 그 액션 목록. 원복이었으면 reverting */
  var execOpen = null, reverting = false;
  /** 지금 떠 있는(또는 방금 닫힌) 제안의 종류 */
  var proposalKind = null;
  /** 신호 하나를 엔진에 넣는다. 처리 중에 들어온 신호는 줄을 서서 차례로 들어간다(앱의 SignalBus 와 같은 순서 보장) */
  function emit(label, call, coalesceKey) {
    queue.push([label, call, epoch, coalesceKey || null]);
    if (!pumping) pump();
  }
  function pump() {
    pumping = true;
    try {
      while (queue.length) {
        var item = queue.shift();
        if (item[2] !== epoch) continue;
        var t = clock.now();
        if (item[0]) logEv('in', t, '→ ' + item[0], item[3] || (/^SteeringAngle/.test(item[0]) ? 'steer' : null));
        var events;
        try { events = JSON.parse(item[1](t)); } catch (err) { logEv('err', t, String(err)); continue; }
        handle(events, t);
      }
    } finally { pumping = false; }
    render();
  }

  var sig = {
    gear: function () { emit('GearChanged ' + car.gear, function (t) { return sim.gear(t, car.gear); }); },
    recirc: function () {
      actuator.observeRecirc(car.recirc);
      // 바깥 공기로 두기로 한 뒤 운전자가 직접 내기순환을 켠 것은 거절로 본다(엔진과 같은 쿨다운)
      if (car.recirc && sim && !(ui.running && ui.running.remainingSec > 0) && fresh.onRecircOn(clock.now())) markStaleCooldown(clock.now());
      emit('RecirculationChanged ' + (car.recirc ? '내기순환' : '외기'), function (t) { return sim.recirc(t, car.recirc); });
    },
    passenger: function () { var v = !!car.seats[1]; emit('FrontPassengerChanged ' + v, function (t) { return sim.frontPassenger(t, v); }); },
    autoClimate: function () { var v = car.autoClimate; emit('AutoClimateChanged ' + v, function (t) { return sim.autoClimate(t, v); }); },
    eta: function () { var v = car.eta; emit('DestinationEta ' + (v == null ? '없음' : v + '분'), function (t) { return sim.destinationEta(t, v); }); },
    occupants: function () {
      var n = occupants();
      ui.maxOcc = Math.max(ui.maxOcc, n);
      emit('OccupantsChanged ' + n, function (t) { return sim.occupants(t, n); });
    },
    fan: function () { var v = car.fan; emit('FanSpeedChanged ' + v + '/' + FAN_MAX, function (t) { return sim.fan(t, v, FAN_MAX); }); },
    window: function () { var v = car.window; emit('WindowOpenChanged ' + v + '%', function (t) { return sim.windowOpen(t, v); }); },
    wiper: function () { var v = car.wiper; emit('WiperChanged ' + v, function (t) { return sim.wiper(t, v); }); },
    lowBeam: function () { var v = car.lowBeam; emit('LowBeamChanged ' + v, function (t) { return sim.lowBeam(t, v); }); },
    turn: function () { var v = car.turn; emit('TurnSignalChanged ' + v, function (t) { return sim.turnSignal(t, v); }); },
    telltale: function (type, on, blink) { emit('TelltaleChanged ' + type + ' ' + (on ? (blink ? 'BLINK' : 'ON') : 'OFF'), function (t) { return sim.telltale(t, type, on, blink); }); },
    tripTime: function () { var v = car.tripOdo; emit('TripTimeUpdate ' + v, function (t) { return sim.tripTime(t, v); }); },
    steering: function (deg) { car.steerDeg = deg; emit('SteeringAngle ' + deg, function (t) { return sim.steering(t, deg); }); },
    /** 위치와 속도. 모의 위치는 출발 지점과 전방 쉼터 좌표 사이를 거리 비율로 잇는다 */
    location: function () {
      var p = positionAt(car.posKm), kph = speedNow();
      emit('LocationUpdate ' + p[0].toFixed(4) + ',' + p[1].toFixed(4) + ' ' + kph + 'km/h', function (t) { return sim.location(t, p[0], p[1], kph); }, 'loc');
    },
    proximity: function (within, passed) { emit('RestStopProximity within=' + within + (passed ? ' passed' : ''), function (t) { return sim.restProximity(t, within, passed); }); },
    candidate: function (stop) {
      if (stop) emit('RestStopCandidate ' + stop.name + ' ' + stop.distanceKm.toFixed(1) + 'km', function (t) { return sim.restStopCandidate(t, stop.name, stop.routeLabel, stop.distanceKm, stop.lat, stop.lng); });
      else emit('RestStopCandidate 없음', function (t) { return sim.noRestStop(t); });
    }
  };

  // ---------------------------------------------------------------- 엔진 이벤트 처리 (앱 WakeViewModel.handle 과 같은 순서)

  function handle(events, t) {
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      var key = e.type === 'AirEstimate' || e.type === 'RestTick' || e.type === 'Running' ? e.type : null;
      logEv('ev', t, '← ' + describe(e), key);
      switch (e.type) {
        case 'Propose': onPropose(e); break;
        case 'Announce': onAnnounce(e); break;
        case 'Quiet':
          // 홈 문구는 엔진의 quietMode 를 읽어 바꾼다. 여기서는 한 번 읽어 주기만 한다
          ui.proposal = null;
          say(e.text);
          break;
        case 'TrustChanged': break;
        case 'ProposalExpired':
          ui.proposal = null;
          if (proposalKind === 'STALE_AIR') markStaleCooldown(t);
          say(e.text);
          break;
        case 'Execute':
          // 원복 없이 끝나는 실행인지 가리기 위해, 마지막 Execute 가 원복이었는지 기억한다
          execOpen = e.revert ? null : e.actions; reverting = e.revert;
          ui.proposal = null;
          // 동의 직후 Running 이 오기 전까지 화면이 비지 않게 바로 바를 띄운다
          ui.running = { kind: e.kind, remainingSec: 0, label: e.revert ? tr('reverting') : tr('executing'), pending: e.revert ? 'reverting' : 'executing' };
          actuator.execute(e.actions);
          break;
        case 'Running':
          ui.running = { kind: e.kind, remainingSec: e.remainingSec, label: e.label };
          break;
        case 'Done':
          // 실행 뒤 원복(Execute([Revert])) 없이 Done 이 오면 그대로 두기로 한 것이다(바깥 공기 유지, 풍량 올려 두기).
          // 저장해 둔 실행 전 값을 버려 나중 원복이 되돌리지 않게 한다
          var hadPrompt = !!ui.proposal || !!(ui.rest && ui.rest.ask);
          if (ui.rest) {
            // 쉼 모드의 바깥 공기 질문이 닫혔다. 동의해서 바꿔 둔 값은 쉼이 끝날 때 되돌려야 하니 실행 전 값을 버리지 않는다
            ui.rest.ask = null;
          } else if (execOpen) {
            actuator.keepChanges(execOpen);
            if (execOpen.some(function (a) { return a.type === 'Ventilate'; })) fresh.keep(t);
          } else if (reverting) fresh.onReverted(t);
          execOpen = null; reverting = false;
          ui.proposal = null; ui.running = null; ui.deferred = null;
          // 말없이 닫는 Done: 읽던 질문이 있으면 끊는다. 다른 문장(쉼 끝 한마디 등)은 끊지 않는다
          if (e.text) say(e.text); else if (ui.speaking && hadPrompt) cancelSpeech();
          break;
        case 'Deferred':
          ui.deferred = e.reason; ui.deferredAt = t;
          break;
        case 'TripStateChanged': onTripState(e.state, t); break;
        case 'RestStarted':
          // 화면과 음성 모두 같은 쉼터 표시 이름을 쓴다
          var restName = sim.stopDisplayName(e.stopName);
          ui.rest = { stopName: restName, targetMinutes: e.targetMinutes, remainingSec: e.targetMinutes * (sim.demoFast ? 1 : 60), demo: sim.demoFast, ask: null };
          ui.proposal = null; ui.running = null;
          execOpen = null; reverting = false;
          fresh.onRestStarted(t);
          say(T.ko.restLine(restName, e.targetMinutes, sim.demoFast, true));
          break;
        case 'RestTick':
          if (ui.rest) ui.rest.remainingSec = e.remainingSec;
          break;
        case 'RestEnded':
          var text = demoUnits(e.text, ui.rest ? ui.rest.demo : sim.demoFast);
          tracker.stop();
          fresh.onRestEnded(t);
          ui.rest = null; ui.waypoint = null; ui.restToast = text;
          say(text);
          later(2500, function () { ui.restToast = null; render(); });
          tracker.sendCandidate(true);
          break;
        case 'AirEstimate':
          var prev = ui.air;
          ui.air = { ppm: e.ppm, occupants: e.occupants, minutesToLimit: roundedMinutes(e, sim.effectiveLimitPpm), ventilating: e.ventilating, falling: prev ? (e.ppm < prev.ppm || (e.ppm === prev.ppm && prev.falling)) : false };
          ui.peak = Math.max(ui.peak, e.ppm); ui.maxOcc = Math.max(ui.maxOcc, e.occupants);
          break;
        case 'ArrivalCard':
          ui.arrival = e.card; ui.proposal = null; ui.running = null; ui.rest = null;
          ui.arrivalFresh = fresh.units(t); ui.arrivalDemo = sim.demoFast;
          ui.trustAsk = e.card.trustOffer ? 'ask' : null;
          // 60배 데모면 문장 안의 분도 초로 읽는다
          say(demoUnits(e.card.headline, sim.demoFast));
          break;
      }
    }
  }

  /** 환기 제안을 거절했거나 답이 없었다. 엔진이 그동안 다시 묻지 않으니 홈 문구도 그렇게 알린다(앱 markStaleCooldown) */
  function markStaleCooldown(now) { ui.staleCooldownUntil = now + sim.declineCooldownMinutes * (sim.demoFast ? 1000 : 60000); }

  /**
   * 화면의 "약 N분 뒤". 엔진 값은 올림한 정수라 계산값보다 크게 보인다. 화면에는 반올림해서 보여 준다(앱 AirMath 와 같은 식).
   * 엔진 값이 없거나 0 이거나 환기 중이면 그대로 따르고, 반올림 값이 엔진 값과 1 넘게 벌어지면 엔진 값을 쓴다
   */
  function roundedMinutes(e, limit) {
    var m = e.minutesToLimit;
    if (m == null || m <= 0 || e.ventilating) return m;
    var gen = Math.max(1, e.occupants) * sim.co2PerPersonLph * 1e6 / Math.max(1, sim.cabinVolumeL), ach = sim.leakAch, exact;
    if (e.ppm >= limit) exact = 0;
    else if (ach < 1e-9) exact = gen > 0 ? (limit - e.ppm) / gen * 60 : null;
    else { var css = sim.outdoorPpm + gen / ach; exact = css <= limit ? null : Math.log((css - e.ppm) / (css - limit)) / ach * 60; }
    if (exact == null) return m;
    var r = Math.max(1, Math.round(exact));
    return r >= m - 1 && r <= m ? r : m;
  }

  function onPropose(e) {
    setBoost(1);
    if (ui.rest) {
      // 쉼 모드의 바깥 공기 질문. 쉼 카드 안에서 묻고 화면에서 눌러 답한다. 쉼 안내에 이어서 읽는다
      var ask = ui.rest.ask = { text: e.text, timeoutSec: e.timeoutSec, countdownFrom: null, passenger: !!e.passengerMayAnswer };
      speak(T.ko.restLine(ui.rest.stopName, ui.rest.targetMinutes, ui.rest.demo, true) + ' ' + e.text, function () {
        if (!ui.rest || ui.rest.ask !== ask) return;
        ask.countdownFrom = clock.now();
        emit('SpeechFinished', function (t) { return sim.speechFinished(t); });
      });
      return;
    }
    proposalKind = e.kind;
    ui.proposal = { kind: e.kind, text: e.text, timeoutSec: e.timeoutSec, countdownFrom: null, passenger: !!e.passengerMayAnswer, announce: false };
    ui.deferred = null;
    // 문장을 다 읽으면 SpeechFinished. 엔진은 그때부터 timeoutSec 를 센다
    speak(e.text, function () {
      if (!ui.proposal) return;
      ui.proposal.countdownFrom = clock.now();
      emit('SpeechFinished', function (t) { return sim.speechFinished(t); });
    });
  }

  /** 이 페이지에는 음성 인식이 없다. 앱이 말로 답할 수 없는 환경에서 하듯 예고 문장의 "아니라고 하세요" 를 "취소를 누르세요" 로 바꿔 보여 주고 읽는다(앱 announceText) */
  function announceText(text) { return String(text).replace("싫으면 '아니'라고 하세요", '싫으면 취소를 누르세요'); }

  /** 맡겨 둔 환기의 예고. 문장을 다 읽은 뒤 cancelWindowSec 안에 취소가 없으면 엔진이 Execute 를 낸다 */
  function onAnnounce(e) {
    setBoost(1);
    proposalKind = e.kind;
    var text = announceText(e.text);
    var p = ui.proposal = { kind: e.kind, text: text, timeoutSec: e.cancelWindowSec, countdownFrom: null, passenger: false, announce: true };
    ui.deferred = null;
    speak(text, function () {
      if (ui.proposal !== p) return;
      p.countdownFrom = clock.now();
      emit('SpeechFinished', function (t) { return sim.speechFinished(t); });
    });
  }

  /** 60배 데모에서 엔진이 "분"으로 적은 시간(쉰 시간 등)은 실제로 초였다. 숫자 뒤의 "분"만 "초"로 바꾼다(앱 DemoText.minutesToSeconds) */

      car.tripOdo = 0;
      ui.lastSaid = null; ui.arrival = null; ui.rest = null; ui.restToast = null; ui.waypoint = null; ui.proximityKm = null;
      ui.vents = 0; ui.peak = 0; ui.maxOcc = occupants(); ui.air = null; ui.evidence = null;

  /** 실행 중 바의 [취소]. 예고로 시작한 환기와 직접 요청한 환기는 유지 시간 내내 취소할 수 있다(엔진이 바로 원복한다) */
  function cancelRun() {
    if (!sim.cancellableRun) return;

  }

  function requestFreshAir() {

    emit('requestVentilation (화면 버튼)', function (t) { return sim.requestVentilation(t); });
  }

  /** 도착 카드의 맡기기 질문에 답한다 */
  function trustAnswer(accept) {
    if (ui.trustAsk !== 'ask') return;

    emit('TrustAnswer ' + (accept ? '맡길게요' : '계속 물어봐 주세요'), function (t) { return sim.trustAnswer(t, accept); });
  }

      car.tripOdo = 0;

  // ---------------------------------------------------------------- 말하기

  var speechSeq = 0;
  function koVoice() {
    try {
      if (!('speechSynthesis' in window)) return null;

    } catch (err) { return null; }
  }

   * 소리로 읽을 문장(앱 speechText 와 같은 규칙). 괄호와 그 안(화면용 추정 수치)은 읽지 않는다.
   * 괄호가 겹쳐 있으면 바깥 괄호까지, 닫는 괄호가 없으면 끝까지 뺀다. 남은 겹친 공백과 문장부호 앞 공백은 정리한다
   */
  function spoken(text) {
    var out = '', depth = 0;
    String(text).split('').forEach(function (ch) {
      if (ch === '(' || ch === '\uFF08') depth++;

      else if (depth === 0) out += ch;

  function speak(text, onDone) {
    cancelSpeech();

    ui.speaking = true; ui.lastSaid = text;
    var finished = false;
    var finish = function () {
      if (finished || id !== speechSeq || my !== epoch) return;
      finished = true;
      ui.speaking = false;
      if (onDone) onDone();
      render();
    };
    var v = voice ? koVoice() : null;
    ui.voiceMissing = voice && !v;
    if (v) {
      try {
        var u = new SpeechSynthesisUtterance(spoken(text));
        u.lang = 'ko-KR'; u.voice = v;
        u.onend = finish; u.onerror = finish;
        speechSynthesis.speak(u);

        later(spoken(text).length * 400 + 4000, finish);

    }

    cap('d16');
    if (!(await wait(1800))) return;
    cap('d17'); user.gear('PARK');
    if (!(await until(function () { return ui.rest; }, 5000))) return;
    if (!(await wait(2600))) return;
    if (ui.rest && ui.rest.ask) {
      cap('d17b');
      if (!(await until(function () { return !ui.rest || !ui.rest.ask || ui.rest.ask.countdownFrom != null; }, 20000))) return;
      if (!(await wait(1800))) return;
      cap('d17c'); answer(true);
      if (!(await until(function () { return !car.recirc; }, 6000))) return;
      if (!(await wait(3200))) return;
    } else if (!(await wait(3600))) return;
    cap('d18'); user.gear('DRIVE');
    if (!(await wait(3800))) return;
    cap('d19'); user.gear('PARK');
    if (!(await until(function () { return ui.arrival; }, 5000))) return;
    if (!(await wait(3200))) return;
    if (ui.trustAsk === 'ask') {
      cap('d19b');
      if (!(await wait(4200))) return;
      trustAnswer(true);
      if (!(await wait(2200))) return;
    }
    k.finish('d20');
  }

  /**
   * 맡기기 시연(약 40초): 맡기기를 켠 채 혼자 출발 → 예고 → 5초 뒤 스스로 실행 → 원복 → 다시 예고 → 이번에는 취소.
   * 기다리기만 하는 구간(탁해질 때까지, 환기 유지 20초)은 빨리 감는다. 예고와 취소 창은 실제 속도다
   */
  async function runTrustDemo() {
    var k = demoKit('trust'), cap = k.cap, wait = k.wait, until = k.until;
    var announced = function () { return ui.proposal && ui.proposal.announce; };
    user.trust(true);
    cap('t1');
    if (!(await wait(1500))) return;
    user.gear('DRIVE');
    if (!(await wait(1000))) return;
    cap('t2'); user.recirc(true);
    setBoost(6);
    if (!(await until(announced, 60000))) return;
    cap('t3');
    if (!(await until(function () { return ui.running && ui.running.remainingSec > 0; }, 30000))) return;
    cap('t4');
    setBoost(4);
    if (!(await until(function () { return idle() && car.recirc; }, 60000))) return;
    setBoost(1);
    cap('t5');
    if (!(await wait(2500))) return;
    setBoost(6);
    if (!(await until(announced, 90000))) return;
    cap('t6');
    if (!(await until(readOut, 20000))) return;
    if (!(await wait(1800))) return;
    answer(false);
    cap('t7');
    if (!(await wait(3500))) return;
    k.finish('t8');
  }

  // ---------------------------------------------------------------- 입력 연결

  function wire() {
    $('btnDemo').addEventListener('click', function () { if (demo && demo.kind === 'main') stopDemo('dStopped'); else runDemo(); });
    $('btnTrust').addEventListener('click', function () { if (demo && demo.kind === 'trust') stopDemo('dStopped'); else runTrustDemo(); });
    $('btnReset').addEventListener('click', function () { hardReset(); });
    $('runCancel').addEventListener('click', function () { cancelRun(); });
    $('btnFresh').addEventListener('click', function () { requestFreshAir(); });
    // 탭이 가려지면 앱 화면이 안 보이는 것과 같다. 엔진은 그동안 예고 대신 묻고, 넘어간 제안을 거절로 세지 않는다
    document.addEventListener('visibilitychange', function () {
      var visible = !document.hidden;
      emit('AppVisibility ' + (visible ? '보임' : '가려짐'), function (t) { return sim.appVisibility(t, visible); });
    });
    $('segSpeed').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; stopDemo('dStopped'); setSpeed(b.dataset.speed === 'demo'); });
    $('btnVoice').addEventListener('click', function () {
      voice = !voice;
      if (!voice) { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (err) { /* 무시 */ } ui.voiceMissing = false; }
      else ui.voiceMissing = !koVoice();
      renderChrome(); render();
    });
    $('segLang').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; lang = b.dataset.lang; applyLang(); });

    try {
      if ('speechSynthesis' in window) {
        speechSynthesis.getVoices();
        speechSynthesis.addEventListener('voiceschanged', function () { if (voice) { ui.voiceMissing = !koVoice(); render(); } });
      }
    } catch (err) { /* 음성 없는 브라우저 */ }
    $('evBox').addEventListener('toggle', function () { logsDirty = true; renderChrome(); renderLogs(); });

    // 사용자가 평면도, 버튼 띠, 헤드유닛에 손대면 자동 시연을 멈춘다(자동 시연은 DOM 이벤트를 쓰지 않는다)
    var touched = function (e) { if (demo && e.isTrusted) stopDemo('dStopped'); };
    ['pointerdown', 'keydown'].forEach(function (type) {
      ['plan', 'strip', 'screenWrap', 'actbar'].forEach(function (id) { $(id).addEventListener(type, touched, true); });
    });
    var click = function (id, fn) { $(id).addEventListener('click', fn); };

    $('segGear').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) user.gear(b.dataset.gear); });
    $('seats').addEventListener('click', function (e) {
      var b = e.target.closest('.seat');
      if (!b || b.disabled) return;
      var i = +b.dataset.seat;
      user.seat(i, !car.seats[i]);
      if (hint === 'seat') { hint = driving() ? 'done' : 'gear'; render(); }
    });
    click('hvRecirc', function () { user.recirc(!car.recirc); });
    click('fanDn', function () { user.fan(car.fan - 1); });
    click('fanUp', function () { user.fan(car.fan + 1); });
    click('tempDn', function () { user.temp(car.temp - 0.5); });
    click('tempUp', function () { user.temp(car.temp + 0.5); });
    click('winDn', function () { user.window(car.window + 10); });
    click('winUp', function () { user.window(car.window - 10); });
    click('swWiper', function () { user.wiper(!car.wiper); });
    click('swBeam', function () { user.lowBeam(!car.lowBeam); });
    click('turnL', function () { user.turn(car.turn === 'LEFT' ? 'OFF' : 'LEFT'); });
    click('turnR', function () { user.turn(car.turn === 'RIGHT' ? 'OFF' : 'RIGHT'); });
    click('swAttn', function () { user.attention(!car.attention); });
    click('btnSteer', function () { user.steerJerks(); });
    click('swAuto', function () { user.autoClimate(!car.autoClimate); });
    click('btnEta', function () { user.eta(car.eta == null ? 4 : null); });
    click('swTrust', function () { user.trust(!trust().delegated); });
    click('btnTrip', function () { user.tripAdd(120); });
    click('btnWithin', function () { tracker.arrive(); render(); });

    click('pYes', function () { answer(true); });
    click('pNo', function () { answer(false); });
    click('aOk', dismissArrival);
    click('xYes', function () { answer(true); });
    click('xNo', function () { answer(false); });
    click('xOk', dismissArrival);
    click('rYes', function () { answer(true); });
    click('rNo', function () { answer(false); });
    click('aTrustYes', function () { trustAnswer(true); });
    click('aTrustNo', function () { trustAnswer(false); });
    click('xTrustYes', function () { trustAnswer(true); });
    click('xTrustNo', function () { trustAnswer(false); });

    // 차량 화면을 폭에 맞춰 축소. 평면도는 좁은 화면에서 세로로 돌린다
    var wrap = $('screenWrap');
    // 폭이 560px 보다 좁으면 논리 크기를 960x540 으로 줄여 글자가 상대적으로 커지게 한다
    var fit = function () {
      var w = wrap.clientWidth, was = huSmall;
      huSmall = w < 560; huLW = huSmall ? 960 : 1280;
      if (was !== huSmall && sim) buildGauge();
      $('car').classList.toggle('s', huSmall);
      $('car').style.setProperty('--k', String(w / huLW));
    };
    if ('ResizeObserver' in window) new ResizeObserver(fit).observe(wrap);
    window.addEventListener('resize', function () { fit(); if (narrow() !== vert) buildPlan(); renderChrome(); render(); });
    fit();
  }

  // ---------------------------------------------------------------- 시작

  var lastFast = clock.now();
  wire();
  boot();
  applyLang();

  // 엔진 tick 은 시계로 1초마다(빨리 감는 동안에도 엔진이 보는 간격은 1초). 그 사이에는 경유지까지 거리와 카운트다운 표시만 고친다
  var tickCount = 0, lastTickAt = clock.now();
  setInterval(function () {
    var now = clock.now(), dt = now - lastFast;
    lastFast = now;
    tracker.advance(dt);
    if (now - lastTickAt >= 990) {
      lastTickAt = now;
      // 주행 중에는 5초마다 위치와 속도를 보낸다
      if (driving() && ++tickCount % 5 === 0) {
        sig.location();
        // 내비가 살아 있는 것처럼 남은 시간을 다시 알린다. 엔진은 받은 지 10분(데모 10초)이 지난 값을 쓰지 않는다
        if (car.eta != null) { var eta = car.eta; emit(null, function (t) { return sim.destinationEta(t, eta); }); }
      }
      emit(null, function (t) { return sim.tick(t); });
    } else render();
  }, 250 / TS);

  if (params.get('demo') === '1') runDemo();
  else if (params.get('demo') === 'trust') runTrustDemo();

  // 시험용 손잡이(자동 검증 스크립트가 상태를 읽는다)
  window.__kkaeugi = {
    state: function () { return { ui: ui, car: car, phase: sim.phase, ppm: sim.ppm, tripState: sim.tripState, demo: !!demo, caption: caption.key, sdk: sdkLog.length, lang: lang, trust: trust(), quiet: sim.quietMode, variant: sim.lastProposalVariant, boost: boost }; },
    sdkLog: function () { return sdkLog.slice(); },
    evLog: function () { return evLog.map(function (l) { return l.text; }); },
    user: user, answer: answer, trustAnswer: trustAnswer, runDemo: runDemo, runTrustDemo: runTrustDemo, tracker: tracker,
    cancelRun: cancelRun, requestFreshAir: requestFreshAir,
    /** 탭이 가려진 것처럼 엔진에 알린다(자동 검증용) */
    setVisible: function (v) { emit('AppVisibility ' + (v ? '보임' : '가려짐'), function (t) { return sim.appVisibility(t, v); }); }
  };
})();
</script>
</body>
</html>
