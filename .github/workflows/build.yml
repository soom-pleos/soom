name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Pleos Playground Maven (https://nexus-playground.pleos.ai/repository/maven-releases/)
      # 은 2026-11 기준 인증 없이 읽기 가능해 settings.gradle.kts 에 자격 증명이 없다.
      # 저장소가 인증을 요구하게 되면 settings.gradle.kts 의 maven {} 블록에 credentials 를 추가하고
      # 아래 env 의 주석을 풀어 repository secrets PLEOS_MAVEN_USER / PLEOS_MAVEN_PASSWORD 로 넘긴다.
      - name: Unit tests and release APK
        run: ./gradlew --no-daemon :engine:test :app:testReleaseUnitTest :app:assembleRelease
        # env:
        #   ORG_GRADLE_PROJECT_pleosMavenUser: ${{ secrets.PLEOS_MAVEN_USER }}
        #   ORG_GRADLE_PROJECT_pleosMavenPassword: ${{ secrets.PLEOS_MAVEN_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kkaeugi-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            engine/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
